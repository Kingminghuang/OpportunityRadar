name: Deploy Opportunity Radar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Install dependencies
        run: npm ci
      - name: Resolve Pages metadata
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO_NAME_LOWER="${REPO_NAME,,}"

          if [ -z "$PAGES_ORIGIN" ]; then
            PAGES_ORIGIN="https://${OWNER_LOWER}.github.io"
          fi

          if [ -z "$PAGES_BASE_PATH" ]; then
            if [ "$REPO_NAME_LOWER" = "${OWNER_LOWER}.github.io" ]; then
              PAGES_BASE_PATH=""
            else
              PAGES_BASE_PATH="/$REPO_NAME_LOWER"
            fi
          fi

          echo "SITE_URL=$PAGES_ORIGIN" >> "$GITHUB_ENV"
          echo "BASE_PATH=$PAGES_BASE_PATH" >> "$GITHUB_ENV"
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
